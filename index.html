function costsFor(id,start,end){let within=r=>(!id||r.equipment===id)&&(!start||r.date>=start)&&(!end||r.date<=end);return {fuel:db.fuel.filter(within).reduce((a,r)=>a+num(r.quantity)*num(r.price),0),maintenance:db.maintenance.filter(within).reduce((a,r)=>a+num(r.cost),0),parts:db.stock.filter(r=>within(r)&&r.type==='صرف').reduce((a,r)=>a+num(r.quantity)*num(r.price),0),movement:db.movement.filter(within).reduce((a,r)=>a+num(r.cost),0),other:db.costs.filter(within).reduce((a,r)=>a+num(r.cost),0)}}let reportStart='',reportEnd='';function reports(){let within=r=>(!reportStart||r.date>=reportStart)&&(!reportEnd||r.date<=reportEnd),ops=db.operations.filter(r=>within(r)&&r.status==='معتمد'),sum=(list,k)=>list.reduce((a,r)=>a+num(r[k]),0),hours=sum(ops,'hours'),standby=sum(ops,'standby'),down=sum(ops,'downtime'),c=costsFor('',reportStart,reportEnd),total=Object.values(c).reduce((a,b)=>a+b,0);$('content').innerHTML=`<section class="panel"><div class="toolbar"><label>من <input type="date" value="${reportStart}" onchange="reportStart=this.value;reports()"></label><label>إلى <input type="date" value="${reportEnd}" onchange="reportEnd=this.value;reports()"></label><button class="btn" onclick="window.print()">طباعة / PDF</button><button class="btn" onclick="exportReport()">Excel / CSV</button></div></section><div class="cards">${[['ساعات التشغيل المعتمدة',fmt(hours)],['ساعات الانتظار',fmt(standby)],['ساعات التوقف',fmt(down)],['نسبة الاستغلال المسجل',hours+standby+down?fmt(hours/(hours+standby+down)*100)+'%':'—'],['إجمالي التكاليف المسجلة',fmt(total)],['التكلفة لكل ساعة',hours?fmt(total/hours):'—']].map(([l,v])=>`<div class="kpi"><small>${l}</small><div class="value">${v}</div></div>`).join('')}</div><section class="panel"><h2>تحليل التكاليف (ر.س)</h2>${Object.entries(c).map(([k,v])=>`<div class="line"><span>${{fuel:'وقود وزيوت',maintenance:'أوامر الصيانة',parts:'قطع الغيار المصروفة',movement:'النقل',other:'مصروفات إضافية'}[k]}</span><b>${fmt(v)}</b></div><div class="track"><div class="fill" style="width:${total?v/total*100:0}%"></div></div>`).join('')}<small>التقرير يجمع التكاليف المسجلة حسب تاريخ السجل. لا تكرر تكاليف الأعطال أو القطع في أوامر الصيانة والمصروفات. لا يشمل تكلفة بلاغ العطل مباشرة منعاً للازدواجية.</small></section><section class="panel"><h2>تكلفة المعدات وساعات تشغيلها</h2><div class="tablewrap"><table><thead><tr><th>المعدة</th><th>ساعات التشغيل</th><th>التكلفة المسجلة</th><th>التكلفة / ساعة</th></tr></thead><tbody>${db.equipment.map(e=>{let h=sum(ops.filter(r=>r.equipment===e.id),'hours'),t=Object.values(costsFor(e.id,reportStart,reportEnd)).reduce((a,b)=>a+b,0);return `<tr><td>${esc(e.code+' — '+e.name)}</td><td>${fmt(h)}</td><td>${fmt(t)}</td><td>${h?fmt(t/h):'—'}</td></tr>`}).join('')}</tbody></table></div></section><section class="panel"><h2>مؤشرات إضافية</h2><small>الجاهزية اللحظية متاحة في لوحة التحكم. حساب MTBF وMTTR والالتزام التاريخي بالصيانة يتطلب سجلات زمنية مكتملة وتعريف ساعات التعرض؛ لم يتم اختلاق قيم لهذه المؤشرات.</small></section>`}function download(filename,content,mime){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function csv(rows){return '\uFEFF'+rows.map(r=>r.map(v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}).join(',')).join('\r\n')}function exportCSV(k){let cols=[...modules[k].fields.map(f=>f.key),...modules[k].cols.filter(c=>!modules[k].fields.some(f=>f.key===c))];download(k+'.csv',csv([cols.map(c=>label(k,c)),...filtered(k).map(r=>cols.map(c=>value(k,r,c)))]),'text/csv;charset=utf-8')}function exportReport(){let rows=[['المعدة','ساعات التشغيل','التكلفة','تكلفة الساعة']];db.equipment.forEach(e=>{let h=db.operations.filter(r=>r.equipment===e.id&&r.status==='معتمد'&&(!reportStart||r.date>=reportStart)&&(!reportEnd||r.date<=reportEnd)).reduce((a,r)=>a+num(r.hours),0),t=Object.values(costsFor(e.id,reportStart,reportEnd)).reduce((a,b)=>a+b,0);rows.push([e.code,h,t,h?t/h:''])});download('equipment_cost_report.csv',csv(rows),'text/csv;charset=utf-8')}function settings(){$('content').innerHTML=`<section class="panel"><h2>إدارة البيانات المحلية</h2><p>يتم تخزين السجلات في متصفحك باستخدام Local Storage. احتفظ بنسخة احتياطية قبل تغيير الجهاز أو حذف بيانات المتصفح.</p><div class="toolbar"><button class="btn primary" onclick="download('fleet_backup.json',JSON.stringify(db,null,2),'application/json')">تصدير نسخة احتياطية</button><button class="btn" onclick="$('importFile').click()">استيراد نسخة احتياطية</button><button class="btn" onclick="if(confirm('استبدال جميع السجلات بالبيانات التجريبية؟')){db=seed();persist();render()}">استعادة بيانات التجربة</button><button class="btn danger" onclick="if(confirm('حذف جميع السجلات المحلية؟')){db=blank();persist();render()}">حذف جميع البيانات</button></div></section><section class="panel"><h2>متطلبات الربط بالموقع</h2><p>قاعدة بيانات خادمية، تسجيل دخول وصلاحيات معزولة، سجل تدقيق، رفع مستندات وصور، اعتماد متعدد المستويات، نسخ احتياطية خادمية، وإشعارات حقيقية. هذه الوظائف خارج نطاق ملف HTML المستقل.</p></section>`}$('importFile').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Object.keys(modules).every(k=>Array.isArray(d[k])&&d[k].every(r=>r&&typeof r==='object'&&/^[a-zA-Z0-9_-]+$/.test(r.id))))throw Error();if(confirm('استبدال البيانات الحالية بالنسخة المستوردة؟')){db=Object.fromEntries(Object.keys(modules).map(k=>[k,d[k]]));persist();render();toast('تم الاستيراد')}}catch{alert('ملف النسخة الاحتياطية غير صالح')}e.target.value=''};render();
